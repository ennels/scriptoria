[project]
name = "scriptoria"
version = "0.1.0"
description = "A local, offline Bible study app — parallel translations, search, cross-references, Strong's, and Greek/Hebrew analysis"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
scriptoria = "scriptoria.server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scriptoria"]
